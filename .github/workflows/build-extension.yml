name: Build Browser Extension

on:
  push:
    paths:
      - "src/**"
      - ".github/workflows/build-extension.yml"
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/build-extension.yml"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: src

      - name: Type-check
        run: npx tsc --noEmit
        working-directory: src

      - name: Build
        run: npm run build
        working-directory: src

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: markdownload-browser-extension
          # Upload all extension files except source and build tools
          path: |
            src/
            !src/background/background.ts
            !src/background/context-menus.ts
            !src/background/extension-options.ts
            !src/background/apache-mime-types.ts
            !src/shared/converter.ts
            !src/shared/default-options.ts
            !src/globals.d.ts
            !src/tsconfig.json
            !src/build.mjs
            !src/package.json
            !src/package-lock.json
            !src/node_modules/
            !src/.gitignore
          retention-days: 90
